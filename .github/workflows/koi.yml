name: Koi
on:
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths: [.github/workflows/koi.yml]
permissions:
  contents: write
concurrency: koi
jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out git-koi-pond
        uses: actions/checkout@v7
        with:
          repository: simaanc/git-koi-pond
          token: ${{ secrets.KOI_SOURCE_TOKEN }}
          path: .koi-src
      - name: Build git-koi-pond
        shell: bash
        run: |
          rustup toolchain install 1.88 --profile minimal
          cargo +1.88 build --release --locked --manifest-path .koi-src/Cargo.toml
      - name: Draw the day's koi
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git_koi=.koi-src/target/release/git-koi
          "$git_koi" collect "$GITHUB_REPOSITORY_OWNER" --output "$RUNNER_TEMP/koi-snapshot.json"
          "$git_koi" render "$RUNNER_TEMP/koi-snapshot.json" --output-dir koi --body asagi
      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
